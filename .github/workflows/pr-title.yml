name: pr title

# Pull requests are squash merged, and the title becomes the commit message.
# It must follow the rule lefthook checks for commits.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|perf|build|ci|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::The pull request title doesn't follow Conventional Commits: $TITLE"
            echo "Expected a title like 'fix: describe the change'."
            exit 1
          fi
